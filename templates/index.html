<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Website Detector</title>
  <style>
    body { font-family: Arial; text-align: center; background: #f3f6fa; padding-top: 100px; }
    input[type=text] { width: 50%; padding: 10px; font-size: 16px; }
    input[type=submit] { padding: 10px 20px; background: #2b78e4; color: white; border: none; cursor: pointer; }
    .result { margin-top: 30px; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔒 AI-Powered Phishing Website Detector</h1>
  <form method="POST">
    <input type="text" name="url" placeholder="Enter website URL" required>
    <input type="submit" value="Check">
  </form>

  {% if result %}
  <div class="result">{{ result }}</div>
  {% endif %}
</body>
</html>
